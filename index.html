<title>BookOS</title>
<link rel=stylesheet href=styles.css>

<div id=boot>
    <div id=book>
        <h1>BookOS</h1>
        <p>opening book...</p>
        <div id=bar>
            <div id=load></div>
        </div>
        <p id=page>page 0</p>
    </div>
</div>

<div id=desk>
    <div id=clockwidget>
        <div id=clockface>
            <div id=hrhand class=hand></div>
            <div id=minhand class=hand></div>
            <div id=sechand class=hand></div>
            <div id=clockpin></div>
        </div>
    </div>
    <div id=grid>
        <div class=deskitem onclick="pop(1)">
            <div class=tile>🕒</div>
            <div class=label>clock</div>
        </div>
        <div class=deskitem onclick="pop(2)">
            <div class=tile>🌐</div>
            <div class=label>browser</div>
        </div>
        <div class=deskitem onclick="pop(3)">
            <div class=tile>🐍</div>
            <div class=label>snake</div>
        </div>
        <div class=deskitem onclick="pop(4)">
            <div class=tile>📝</div>
            <div class=label>notes</div>
        </div>
        <div class=deskitem onclick="pop(5)">
            <div class=tile>✅</div>
            <div class=label>todo</div>
        </div>
    </div>
    <div id=dock>
        <div class=dockitem onclick="pop(1)">
            <div class=tip>clock</div>
            <div class=tile>🕒</div>
        </div>
        <div class=dockitem onclick="pop(2)">
            <div class=tip>browser</div>
            <div class=tile>🌐</div>
        </div>
        <div class=dockitem onclick="pop(3)">
            <div class=tip>snake</div>
            <div class=tile>🐍</div>
        </div>
        <div class=dockitem onclick="pop(4)">
            <div class=tip>notes</div>
            <div class=tile>📝</div>
        </div>
        <div class=dockitem onclick="pop(5)">
            <div class=tip>todo</div>
            <div class=tile>✅</div>
        </div>
    </div>
</div>

<script src=script.js></script>
